
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triagem Cardiológica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.cdnfonts.com/css/poppins" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container mt-5 mb-3 shadow p-4">

        <div class="card-box shadow p-3 titulo">
            <h1 class="text-center"><strong>Triagem</strong></h1>
        </div>

        <div class="card-box shadow mt-4 p-4 paba">
            <h2 class="tp">Campos Obrigatórios</h2>
            <div class="row">
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Pressão Arterial:</label>
                    <input type="text" class="form-control" placeholder="Ex: 120/80 mmHg">
                </div>
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Frequência Cardíaca:</label>
                    <input type="number" class="form-control" placeholder="Batimentos por minuto">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Dor Torácica:</label>
                    <input type="text" class="form-control" placeholder="Presença, intensidade e localização">
                </div>
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Frequência Respiratória:</label>
                    <input type="number" class="form-control" placeholder="Respirações por minuto">
                </div>
            </div> 

            <div class="row">
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Saturação de Oxigênio:</label>
                    <input type="number" class="form-control" placeholder="Ex: 98%">
                </div>
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Histórico Cardiovascular:</label>
                    <input type="text" class="form-control" placeholder="Hipertensão, infarto, arritmia...">
                </div>
            </div> 

            <div class="row">
                <div class="col-md-12 mb-3 mt-3">
                    <label class="form-label">Sintomas Principais:</label>
                    <textarea class="form-control" placeholder="Dor no peito, palpitações, falta de ar, tontura, desmaio ou cansaço."></textarea>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Classificação de Risco</label>
                    <select class="form-select">
                        <option selected disabled> Selecione</option>
                        <option class="bl">Não urgente</option>
                        <option class="gr">Pouco Urgente</option>
                        <option class="yl">Urgente</option>
                        <option class="lr">Muito Urgente</option>
                        <option class="rd">Emergência</option>
                    </select>
                </div>

                <div class="col-md-6 mt-3 mb-3">
                    <label class="form-label">Temperatura</label>
                    <input type="number" class="form-control" placeholder="Temperatura em °C">
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3 mt-3">
                    <label class="form-label">Histórico de Medicamentos:</label>
                    <input type="text" class="form-control" placeholder="Medicamentos em uso">
                </div>
            </div>

            <div class="row">
                <div class="mb-3 mt-4">
                    <button class="button w-100 p-4 by"><a href="/Projeto Sentinela/prescrição/index.html" class="link">Enviar</a></button>
                </div>
            </div>

    </div>
    
</body>
</html>
