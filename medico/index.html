
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.cdnfonts.com/css/poppins" rel="stylesheet">
    <link rel="shortcut icon" href="/Projeto Sentinela/favicon.ico" type="image/x-icon">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>

    <!--
    <header class="topo">
        <h1>Hospital Home</h1>

    </header>
-->

    <div id="maior">
    <div class="container mt-4">

        <div class="text-center mb-4">
            <strong><h1>Hospital Home</h1></strong>
            <p>Módulo: Atendimento Médico</p>
        </div>

        <div class="card-box shadow meir">
            <h3>Prontuário do Paciente</h3>

            <div class="row">
                <div class="col-md-6">
                    <p><strong>Nome:</strong>Maria da Silva</p>
                    <p><strong>CPF:</strong>000.000.000.-00</p>
                    <p><strong> Data de Nascimento:</strong> 01/01/1990</p>
                </div>
                
                <div class="col-md-6">
                    <p><strong>Sexo:</strong>Feminino</p>
                    <p><strong>Telefone</strong>(61)99999-9999</p>
                    <p><strong>Convênio:</strong> SUS</p>
                </div>
            </div>
        </div>

        <div class="card-box shadow ficha">

            <h3>Registro de Atendimento</h3>

            <div class="campo">
                <label> CRM do Médico:</label>
                <input type="text" placeholder="Digite o CRM">
            </div>
            
            <div class="campo">
                <label> Queixa Principal:</label> 
                <textarea placeholder="Dor no peito, palpitações, falta de ar, tontura ou cansaço."></textarea>
            </div>
            
            <div class="campo">
                <label> Tempo de Evolução:</label> 
                <textarea placeholder="Há quanto tempo os sintomas cardíacos começaram."></textarea>
            </div>
            
            <div class="campo">
                <label> Sinais Vitais: </label> 
                <textarea placeholder="Pressão arterial, frequência cardíaca, frequência respiratória e temperatura."></textarea>
            </div>
            
            <div class="campo">
                <label> Histórico Cardiovascular:</label> 
                <textarea placeholder="Histórico de hipertensão, infarto, arritmias e insuficiência cardíaca."></textarea>
            </div> 
            
            <div class="campo">
                <label>Histórico da Moléstia Atual (HDA):</label> 
                <textarea placeholder="Cronologia detalhada dos sintomas, como dor torácica, palpitações e falta de ar."></textarea>
            </div> 

            <div class="campo">
                <label>Medicamentos em Uso:</label> 
                <textarea placeholder="Registrar medicamentos utilizados, especialmente anti-hipertensivos, anticoagulantes e antiarrítmicos."></textarea>
            </div> 

            <div class="campo">
                <label>Alergias:</label> 
                <textarea placeholder="Registro de alergias a medicamentos e outras substâncias."></textarea>
            </div> 

            <div class="campo">
                <label>Histórico Familiar: </label> 
                <textarea placeholder="Doenças cardíacas na família, como hipertensão, infarto e arritmias."></textarea>
            </div> 

            <div class="campo">
                <label>Exames Cardiológicos:</label> 
                <textarea placeholder="Eletrocardiograma (ECG), ecocardiograma, teste ergométrico e Holter."></textarea>
            </div> 

            <div class="campo">
                <label>Diagnóstico Cardiológico:</label> 
                <textarea placeholder="Registrar o diagnóstico ou a hipótese diagnóstica do médico."></textarea>
            </div> 
            
            <div class="botoes">
                <button class="btn-salvar">Salvar Atendimento</button>
                <button class="btn-secundario">Cancelar</button>
            </div>           

        </div>
    </div>
    </div>

</body>
</html>
